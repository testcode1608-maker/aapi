name: Fix admin investment statistics

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/Administrator.tsx'
      - '.github/workflows/fix-admin-investments.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix investment statistics mapping
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/Administrator.tsx')
          text = path.read_text(encoding='utf-8')

          old = 'const s=data.stats??{},inv=s.investments??data.investments??{},projects='
          new = 'const s=data.stats??{},inv={total:Number(s.investments_total??data.investments?.total??0),en_attente:Number(s.investments_pending??data.investments?.en_attente??0),valide:Number(s.investments_validated??data.investments?.valide??0),en_cours:Number(s.investments_active??data.investments?.en_cours??0),termine:Number(s.investments_completed??data.investments?.termine??0),annule:Number(s.investments_cancelled??data.investments?.annule??0),montant_total:Number(s.investments_gross_amount??data.investments?.montant_total??0)},projects='

          if old not in text:
              print('Investment mapping already fixed or source changed; nothing to do.')
              raise SystemExit(0)

          text = text.replace(old, new, 1)

          old_panel = '<div className="admin-progress-list"><Progress title="في الانتظار" value={inv.en_attente??0} total={inv.total??0}/><Progress title="مقبولة" value={inv.valide??0} total={inv.total??0}/><Progress title="قيد التنفيذ" value={inv.en_cours??0} total={inv.total??0}/></div>'
          new_panel = '<div className="admin-progress-list"><Progress title="في الانتظار" value={inv.en_attente} total={inv.total}/><Progress title="مقبولة" value={inv.valide} total={inv.total}/><Progress title="قيد التنفيذ" value={inv.en_cours} total={inv.total}/><Progress title="منتهية" value={inv.termine} total={inv.total}/><Progress title="ملغاة" value={inv.annule} total={inv.total}/></div>'

          if old_panel in text:
              text = text.replace(old_panel, new_panel, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Administrator.tsx
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix real admin investment statistics"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-admin-investments.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary admin investment fix workflow"
          git push
