name: Clean AdminDashboard.tsx

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-admin-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format AdminDashboard.tsx
        run: npx --yes prettier@3 --write src/pages/AdminDashboard.tsx

      - name: TypeScript check
        run: npx tsc -b --pretty false

      - name: Commit cleaned AdminDashboard.tsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.tsx
          git diff --cached --quiet || git commit -m "Clean and format AdminDashboard.tsx"
          git push
